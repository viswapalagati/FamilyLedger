{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset password{% endblock %}
{% block auth_content %}
<div class="fl-auth"><div class="fl-auth-card">
  <h1 class="h4">Reset your password</h1>
  <p class="text-muted">Enter your email and we'll send a reset link.</p>
  <form method="post" novalidate>{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-brand w-100 mt-2" type="submit">Send reset link</button>
  </form>
  <p class="text-center mt-3 small"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
</div></div>
{% endblock %}
