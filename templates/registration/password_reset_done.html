{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block auth_content %}
<div class="fl-auth"><div class="fl-auth-card">
  <h1 class="h4">Check your email</h1>
  <p class="text-muted">If an account exists for that address, a password reset
    link is on its way. It expires shortly, so use it soon.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-soft w-100">Back to sign in</a>
</div></div>
{% endblock %}
