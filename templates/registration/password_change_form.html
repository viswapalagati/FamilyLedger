{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Change password{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="fl-card" style="max-width:560px;">
  <div class="fl-card-title">Change your password</div>
  <form method="post" novalidate>{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-brand mt-2" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
