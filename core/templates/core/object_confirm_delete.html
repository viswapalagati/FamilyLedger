{% extends "base.html" %}

{% block title %}Delete · FamilyLedger{% endblock %}
{% block page_title %}Confirm delete{% endblock %}

{% block content %}
<div class="fl-card" style="max-width:560px;">
  <div class="fl-card-title">Delete this record?</div>
  <p class="text-muted">You are about to permanently delete
    <strong>{{ object }}</strong>. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{{ cancel_url|default:'/dashboard/' }}" class="btn btn-soft">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
